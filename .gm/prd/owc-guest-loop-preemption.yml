id: owc-guest-loop-preemption
subject: 'HOST defect: a guest infinite loop cannot be stopped. The runner timeoutMs cannot fire while the guest runs (observed: the 400 s bound was exceeded and the sass process tree was alive at 484 s and 575 s; killed at 600 s). Cause: the QuickJS interrupt handler is armed only inside vm.run (capabilities/vm.ts lines 32-38, which fire only when host.deadline is non-zero); runMain (process.ts line 375) arms nothing, so a bytecode loop blocks the host event loop. In a browser this freezes the tab. Fix design: arm one interrupt handler per runtime for the process lifetime that checks a cancel flag (and the vm deadline), set by a kill path (for example a container-level kill for a pid) and by an optional CPU budget; default behaviour unchanged. Witness: an infinite bytecode loop in a guest is stopped within the budget or by the kill, the host event loop keeps running, and a normal program is unaffected in the corpus.'
session_id: owc-r4
status: pending
