id: owc-als-across-await-engine
title: AsyncLocalStorage across await needs an engine promise/async-context hook
subject: 'ENGINE classification, split out of owc-async-context-and-rejections (witness .gm/witness/owc-async-context-and-rejections.txt). AsyncLocalStorage keeps its store across setTimeout, nextTick, setImmediate and promise .then but loses it across every await (await null, await 42, await Promise.resolve(1), await timer promise, two awaits in a row): host Node 24.15 keeps the store in all of them. Measured cause: unlike V8, QuickJS does call Promise.prototype.then for await, but the async-function suspension unwinds the JS stack first, so the guest hook''s finally has already restored currentFrame when the engine calls then (frameAtThen=undefined), and the async function''s resumption runs in a job of its own enqueued after the reaction returns, so no JS-level reaction wrapper can hand it the frame. guest/loader.ts runInAsyncContext covers only timers, ticks and microtasks; there is no host hook around JS_ExecutePendingJob. Missing hook, named: V8''s promise hook (SetPromiseHook with init/before/after/promiseResolve) that Node''s async_hooks AsyncLocalStorage is built on; its QuickJS analogue would be a host hook on job enqueue/run. Evidence it is absent: an exhaustive scan of quickjs-emscripten@0.32.0 (18 files, exhaustive: true) holds neither ''setHostPromiseRejectionTracker'' nor ''Hook''. Unblocks only by shipping a QuickJS build that exposes a promise/async-context hook (rebuilding the engine to WASM), or by moving the guest off QuickJS await.'
acceptance_criteria:
- A probe that sets an AsyncLocalStorage store and reads it after await null, await Promise.resolve(1), await a timer promise and after two awaits in a row prints the store in the container exactly as node 24.15 does
- The store is still undefined outside the async flow, so no context leaks into unrelated later microtasks or macrotasks
witness_plan: Run /tmp/owc-r4/probe-als/ctx and /tmp/owc-r4/probe-als/awaitkind main.js under host node and in the container via /tmp/owc-r4/probe2/run-owc-repo.mts from packages/core and diff stdout and exit code line by line.
