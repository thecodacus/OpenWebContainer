id: owc-stream-helper-defects
subject: 'Defects found by the black-box witness of the stream helper surface (dispatch 1792020049805-500-faa481f021c245d2 and 1792020101208-500-d3b0bc364a2f004e, 170 cases, 129 substantively equal to Node 24.15): stream.compose is not callable (all 5 cases); Blob.stream() is missing; fs.utimesSync, fs.symlinkSync and fs.lstatSync throw ''not a function''; fs.Dirent is unusable as an instanceof operand (promises.opendir); fs.statSync ignores the bigint option; createReadStream does not validate start and end at construction and ReadStream.bytesRead is undefined; toArray and forEach resolve on a pre-aborted signal where Node rejects ABORT_ERR, and toArray does not validate options.signal; take and drop with a negative or string limit diverge (Node: ERR_OUT_OF_RANGE on number, [] for a string limit in take); reduce on an empty stream without an initial value must reject ERR_MISSING_ARGS; pipeline from stream/promises must accept a raw async generator as a source; isUtf8 and isAscii must reject DataView with ERR_INVALID_ARG_TYPE; several argument-error messages differ by text. The two abort-midway cases were vacuous (both sides timed out) and must be re-witnessed.'
session_id: owc-r4
status: pending
