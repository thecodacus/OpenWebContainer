id: owc-http3-supported
subject: 'HTTP/3 (RFC 9114) over QUIC version 1 (RFC 9000, transport; RFC 9001, TLS 1.3 integration and packet protection) with QPACK (RFC 9204), client and server over the virtual UDP hub, including packet number spaces, header protection, ACK ranges, STREAM and CRYPTO frames, flow control, loss detection and PTO timers, connection IDs, idle timeout, and CONNECTION_CLOSE. Node 24.15 has no QUIC or HTTP/3 module (node:quic and node:http3 are unknown with and without --experimental-quic), so the references are: RFC 9001 Appendix A packet protection and initial-secret vectors, and aioquic 1.6.1 (installed in the scratch venv /tmp/owc-r4/quic-ref/venv) interop both directions through the bridge harness. Depends on owc-tls-functional (TLS 1.3 handshake in QUIC mode) and the UDP path of the bridge. Witness plan is staged: transport and packet protection vectors first, then handshake interop, then HTTP/3 request and response with QPACK static table, then streams and flow control under loss.'
