id: owc-sr-principles-applied
subject: 'PRINCIPLES APPLIED TO THE ARTIFACT (stream.ts only): CLEANNAME: names follow Node (Readable, Writable, Duplex, Transform, pipeline, finished, createInterface). MILNER and DBC: argument validation with Node error codes (ERR_INVALID_ARG_TYPE, ERR_STREAM_NULL_VALUES, ERR_STREAM_WRITE_AFTER_END, ERR_STREAM_DESTROYED, ERR_STREAM_PUSH_AFTER_EOF, ERR_UNKNOWN_ENCODING, ERR_USE_AFTER_CLOSE). ILLEGAL and PARSEDV: options normalised once into state records (makeReadableState, makeWritableState) so flags such as ended, endEmitted, finished are checked in one place. PARNAS and DEEPMOD: all state lives inside owcBuildStreamCore closure; readline state sits behind a non-enumerable symbol; public surface limited to the YAGNI list. GUARD: early returns for destroyed, errored and ended states. SLAP and STRUCTPROG: helper functions per concern (emit, finish, buffer, decoder); loops are for and while only. DRY: one destroy implementation (destroyImpl) shared by Readable and Writable, one finished/pipeline pair, shared getters via defineSharedGetters and defineWritableGetters. KISS and YAGNI: web streams, compose, duplexPair and addAbortSignal excluded (row owc-sr-yagni-scope). COMMENTSMELL: comments only where the Node algorithm is not obvious. IMMUT and OWNERSHIP: not applicable (stream state is mutable by design; no shared mutable data escapes the closure except the returned module objects). INDEPVER: independent black-box verifier dispatched with the spec only.'
